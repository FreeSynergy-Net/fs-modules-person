# cargo-nextest profiles for fs-modules-person (workflow testlauf, CLAUDE.md §4: little but often). Vorlage fs-components 216594c0.
# Geprüft mit `cargo nextest list` (C4 Batch 2). Muster: fs-rpc .config/nextest.toml.
# Stufen: quick (alles ausser CI-only) | security (me p5, p6, p7, p9; additiv) | release (nur CI, alles). Keine eindeutigen Namen für time/socket/platform/picture.

[profile.default]
fail-fast = false

[profile.quick]
fail-fast = true
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }

# Security (Eigentümer/Akteur nicht fälschbar: me p5, p6, p7, p9; CLAUDE.md §4 harte Grenze 2). Additiv: quick bleibt unverändert und enthält diese Tests weiter.
[profile.security]
default-filter = "binary_id(/^fs-person(-service)?::me$/) & test(/^p[5679]_/)"
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.release]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 10 }
