[package]
name = "fs-person-service"
description = "The person module as a service of FreeSynergy: one process per person, serving the form source of the module person"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_person_service"

[[bin]]
name = "fs-person-service"
path = "src/main.rs"

[features]
# `PersonServiceOwner`: the `LocalOwner` for other modules, over the service (reads the form `me`, never creates).
client = ["dep:fs-types", "dep:uuid"]

[dependencies]
fs-person = { path = "../fs-person", version = "0.0.1" }
# One source per library, the same as fs-person and the planning module (rev AND version, licence gate).
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "e3871c3b2438fae23fdc1eb6c72dd7c125f21abd", version = "0.1.4" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "6b02b138b3e55c290d6cbd957976013cc49dca5d", version = "0.3.0" }
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "e38093f1ec61b7c9faaa6f6046f65addb11dcf46", version = "0.0.11" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt", "net", "sync", "time"] }
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", rev = "722d3ce0156711d40cb278f2e835e865d9448290", version = "0.0.7", optional = true }
uuid = { version = "1", optional = true }

[[test]]
name = "client"
required-features = ["client"]

[dev-dependencies]
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "6b02b138b3e55c290d6cbd957976013cc49dca5d", version = "0.3.0", features = ["fake"] }
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", rev = "722d3ce0156711d40cb278f2e835e865d9448290", version = "0.0.7" }
serde_json = "1"
tempfile = "3"
uuid = "1"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
